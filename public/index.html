<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Multi-Source RAG</title>
<style>
  body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
  #sidebar { width: 200px; background: #222; color: white; padding: 20px; }
  #sidebar button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; cursor: pointer; }
  #sidebar button.active { background: #4a90d9; color: white; }
  #main { flex: 1; padding: 20px; overflow-y: auto; }
  .doc-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 14px; }
  #chatArea { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
  #answer { white-space: pre-wrap; margin-top: 10px; line-height: 1.5; }
  #images img { max-width: 150px; margin: 5px; border-radius: 8px; }
  input { width: 70%; padding: 8px; }
  button.ask { padding: 8px 16px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h3>Categories</h3>
    <button onclick="selectSource('potterdb')">Harry Potter</button>
    <button onclick="selectSource('cosmyday')">Horoscope</button>
    <button onclick="selectSource('anycrap')">Anycrap</button>
  </div>

  <div id="main">
    <h2 id="title">Ek category select karein</h2>
    <div id="docs"></div>

    <div id="chatArea" style="display:none">
      <input id="question" placeholder="Is category se related sawal poochein..." />
      <button class="ask" onclick="ask()">Poochein</button>
      <div id="answer"></div>
      <div id="images"></div>
    </div>
  </div>

<script>
let currentSource = null;
const titles = { potterdb: "Harry Potter", cosmyday: "Horoscope", anycrap: "Anycrap" };

async function selectSource(source) {
  currentSource = source;
  document.getElementById("title").innerText = titles[source] + " — Documents";
  document.getElementById("chatArea").style.display = "block";
  document.getElementById("answer").innerText = "";
  document.getElementById("images").innerHTML = "";

  const res = await fetch("/documents?source=" + source);
  const data = await res.json();

  document.getElementById("docs").innerHTML = data.docs
    .map((d) => `<div class="doc-card">${d.text.slice(0, 200)}...</div>`)
    .join("");
}

async function ask() {
  const question = document.getElementById("question").value;
  document.getElementById("answer").innerText = "Soch rahi hoon...";
  document.getElementById("images").innerHTML = "";

  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, source: currentSource }),
  });
  const data = await res.json();

  document.getElementById("answer").innerText = data.answer;
  data.images.forEach((url) => {
    const img = document.createElement("img");
    img.src = url;
    document.getElementById("images").appendChild(img);
  });
}
</script>
</body>
</html>
